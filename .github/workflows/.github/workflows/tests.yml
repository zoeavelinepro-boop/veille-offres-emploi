# Tests automatiques : à chaque modification du code ou de la configuration,
# vérifie que la configuration se lit, que les sources restent cohérentes et que
# le code n'a pas d'erreur de programmation. Aucune requête vers les sites d'offres.
name: Tests

on:
  push:
    branches: [main]
    paths: ['src/**', 'config/**', 'tests/**', 'requirements*.txt', '.github/workflows/tests.yml']
  pull_request:
    paths: ['src/**', 'config/**', 'tests/**', 'requirements*.txt', '.github/workflows/tests.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install -r requirements-dev.txt
      - name: Vérification du code
        run: ruff check src tests
      - name: Tests
        run: pytest -q
