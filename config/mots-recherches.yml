# Mots-clés de recherche de la veille (lus par veille/lecture_config.py).
# Un mot-clé par ligne : `terme` est envoyé tel quel aux moteurs de recherche ;
# `langue` vaut `fr` (envoyé aussi à France Travail, API francophone) ou `en`
# (termes anglais, inexistants sur France Travail). Indeed, LinkedIn, Welcome to
# the Jungle et FashionJobs reçoivent tous les termes ; Hellowork seulement les
# termes français ; BoF Careers seulement les termes anglais.
#
# Liste de Zoé (06/11/2026), rangée par catégorie. Le filtre de titre ne garde
# que les offres dont l'intitulé contient tous les mots d'un terme et ne confond
# pas masculin et féminin : chaque intitulé « Directrice … » ou « Consultante … »
# a donc aussi sa forme masculine.
#
# IMPORTANT — ces recherches ne sont pas exactes.
# Chaque moteur (Indeed, LinkedIn, France Travail, Algolia) tokenise le terme et
# applique sa propre logique de correspondance (radicaux, synonymes, classement).
# Conséquences pratiques :
#   - les moteurs ignorent généralement les mots vides courts (le, la, de, du, des, à, en…) ;
#   - le pluriel et le singulier sont généralement unifiés ;
#   - le masculin et le féminin ne sont généralement pas unifiés ;
#   - les acronymes (CEO, COO, CSO, RSE, ESG) ne sont généralement pas unifiés avec la version longue ;
#   - les accents sont généralement ignorés.

